# YouTube API Configuration
# This file allows you to customize YouTube upload settings without modifying code

# Application name shown in YouTube API requests
youtube.application.name=VJNT Class Management

# Client secrets file name (Google OAuth credentials)
youtube.client.secrets.file=client_secret.json

# Folder where OAuth tokens are stored
youtube.credentials.folder=credentials

# Default video category ID (27 = Education, 22 = People & Blogs, 28 = Science & Technology)
youtube.default.category.id=27

# Default privacy status for uploaded videos (public, unlisted, private)
youtube.default.privacy.status=unlisted

# Default description for videos when none is provided
youtube.default.description=Educational video from VJNT Class Management

# Fallback title when video title is invalid or empty
youtube.fallback.title=Untitled Video

# Maximum title length (YouTube limit is 100 characters)
youtube.max.title.length=100

# Development path for local testing (only used in development environment)
youtube.dev.path=C:\\Users\\Admin\\V2Project\\VJNT Class Managment\\src\\main\\resources\\

# User home directory subfolder for alternate credential storage
youtube.user.home.subfolder=.vjnt/

# Enable direct upload (false = chunked upload with progress tracking)
youtube.direct.upload.enabled=false

# OAuth receiver port (-1 = automatic port selection, or specify port number)
youtube.oauth.receiver.port=-1

# Enable debug logging for troubleshooting
youtube.debug.enabled=false

# Authentication type: "oauth" (YouTube API does NOT support service accounts)
# For production: authorize locally, then copy credentials folder to server
youtube.auth.type=oauth

# Service account JSON key file (only used when auth.type=service-account)
youtube.service.account.file=service-account.json
